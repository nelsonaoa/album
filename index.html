<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>１０３小時光</title>
  <!-- 引入外部 CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- 引入 Google Identity Services (GIS) SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <header>
    <h1>１０３小時光</h1>
  </header>

  <!-- 左側縮圖欄位 -->
  <div id="thumbSidebar" class="thumb-sidebar"></div>

  <!-- 上下箭頭提示 -->
  <div id="scrollHint" class="scroll-hint">
    <span>▲</span>
    <span>▼</span>
  </div>

  <!-- 載入狀態提示 -->
  <div id="loading">驗證身分中...</div>

  <!-- 步驟 1：Google 登入卡片 -->
  <div id="loginCard" class="auth-card-container" style="display: block;">
    <div class="card-icon">📸</div>
    <div class="card-title">私人相簿存取驗證</div>
    <div class="card-desc">請使用授權名單內的 Google 帳號登入以瀏覽相簿內容。</div>
    <div id="googleSignInBtn" class="gis-btn-wrapper"></div>
  </div>

  <!-- 步驟 2：權限不足提示卡片 -->
  <div id="noAccessCard" class="auth-card-container">
    <div class="card-icon">🔒</div>
    <div class="card-title">無此相簿瀏覽權限</div>
    <div id="noAccessMsg" class="card-desc">當前登入的 Google 帳號沒有讀取此相簿的權限，請切換至有權限的帳號。</div>
    <button class="switch-account-btn" onclick="resetAndSwitchAccount()">🔄 切換其他帳號登入</button>
  </div>

  <!-- 主相簿容器 -->
  <div id="gallery" class="gallery-container"></div>

  <!-- 引入外部 JS -->
  <script src="app.js"></script>
</body>
</html>
